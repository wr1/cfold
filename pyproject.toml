[project]
name = "cfold"
version = "0.2.5"
description = "A command line tool to fold and unfold Python projects for LLM interaction"
authors = [{ name = "wr1", email = "8971152+wr1@users.noreply.github.com" }]
requires-python = "~=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "pyyaml>=6.0.2,<7",
    "click>=8.1.7,<9",
    "pyperclip>=1.8.2",
    "pydantic>=2.0.0,<3",
    "treeparse",
    "loguru>=0.7.0,<1",
    "rich>=13.0.0,<14",
]

[project.scripts]
cfold = "cfold.cli.entrypoint:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.1.3,<8",
    "pytest-cov>5.0.0",
]

[tool.hatch.build.targets.sdist]
include = ["src/cfold", "src/cfold/resources"]

[tool.hatch.build.targets.wheel]
include = ["src/cfold", "src/cfold/resources"]

[tool.hatch.build.targets.wheel.sources]
"src/cfold" = "cfold"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
